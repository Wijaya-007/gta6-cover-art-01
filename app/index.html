<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON TIDE — GTA-style cover studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-title">NEON TIDE</span>
    <span class="brand-script">After Midnight</span>
  </div>
  <div class="issue">ISSUE 04</div>
</header>

<main class="studio">
  <section class="preview-pane">
    <canvas id="poster" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="hint">Live preview — every change redraws the poster.</p>
  </section>

  <section class="controls">
    <h2>Make your cover</h2>

    <label class="field">
      <span>Your photo</span>
      <input id="photoFile" type="file" accept="image/*">
    </label>

    <div class="field">
      <span>Or pick a crew photo</span>
      <div class="samples" id="samples"></div>
    </div>

    <div class="field">
      <span>Fill panel</span>
      <div class="panels" id="panels">
        <button data-panel="hero" class="panel-btn active">The Getaway</button>
        <button data-panel="hacker" class="panel-btn">The Hacker</button>
        <button data-panel="broker" class="panel-btn">The Broker</button>
        <button data-panel="enforcer" class="panel-btn">The Enforcer</button>
        <button data-panel="fixer" class="panel-btn">The Fixer</button>
      </div>
    </div>

    <label class="field">
      <span>Title</span>
      <input id="titleInput" type="text" value="NEON TIDE" maxlength="24">
    </label>

    <label class="field">
      <span>Script line</span>
      <input id="scriptInput" type="text" value="After Midnight" maxlength="32">
    </label>

    <label class="field">
      <span>Tagline</span>
      <input id="taglineInput" type="text" value="FIVE CREWS · ONE HARBOR · NO MERCY" maxlength="48">
    </label>

    <div class="field">
      <span>Export size</span>
      <div class="sizes" id="sizes">
        <button data-size="1080x1080" class="size-btn active">1080 × 1080</button>
        <button data-size="1080x1350" class="size-btn">1080 × 1350</button>
        <button data-size="1920x1080" class="size-btn">1920 × 1080</button>
      </div>
    </div>

    <button id="exportBtn" class="export">Export PNG</button>
    <p class="note">Photos stay on your machine — nothing is uploaded.</p>
  </section>
</main>

<footer class="foot">
  <span>★★★★★ PURE COASTAL ADRENALINE</span>
  <span>NEON TIDE — a cover studio, not affiliated with Rockstar Games.</span>
</footer>

<script type="module" src="./src/main.js"></script>
</body>
</html>
